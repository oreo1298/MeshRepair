name: Bambu Studio AppImage

# Builds Bambu Studio with "Fix model" provided by MeshRepair
# (integration/bambustudio) as an AppImage, with the same steps as Bambu
# Studio's own CI, and attaches it to a draft release. Run it from the Actions
# tab, then publish the draft release.

on:
  workflow_dispatch:
    inputs:
      bambu_ref:
        description: Bambu Studio tag to build
        required: true
        default: v02.08.04.61
      release:
        description: Create a draft release with the AppImage
        type: boolean
        default: true

concurrency:
  group: bambustudio-appimage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deps:
    # Bambu Studio's dependencies take hours to build. They are cached and
    # rebuilt only when Bambu Studio changes them.
    name: Dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bambulab/BambuStudio
          ref: ${{ inputs.bambu_ref }}
          path: BambuStudio
      - id: key
        run: echo "key=bambustudio-deps-ubuntu-22.04-${{ hashFiles('BambuStudio/deps/**') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: BambuStudio/deps/build/destdir
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: BambuStudio
        run: |
          sudo ./BuildLinux.sh -ur
          sudo chown -R "$USER" .
      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: BambuStudio
        run: ./BuildLinux.sh -dfr
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: BambuStudio/deps/build/destdir
          key: ${{ steps.key.outputs.key }}

  appimage:
    name: AppImage
    needs: deps
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          path: MeshRepair
      - uses: actions/checkout@v4
        with:
          repository: bambulab/BambuStudio
          ref: ${{ inputs.bambu_ref }}
          path: BambuStudio
      - uses: actions/cache/restore@v4
        with:
          path: BambuStudio/deps/build/destdir
          key: ${{ needs.deps.outputs.key }}
          fail-on-cache-miss: true
      - name: Install build tools
        working-directory: BambuStudio
        run: |
          sudo ./BuildLinux.sh -ur
          sudo chown -R "$USER" .
      - name: Add MeshRepair
        run: python3 MeshRepair/integration/bambustudio/install.py BambuStudio
      - name: Build Bambu Studio and the AppImage
        working-directory: BambuStudio
        run: ./BuildLinux.sh -isfr
      - name: Check that Fix model is built with MeshRepair
        working-directory: BambuStudio/build
        run: |
          grep -q '^SLIC3R_MESHREPAIR:BOOL=ON' CMakeCache.txt
          find . -name libmeshrepair.a | grep -q .
          # Log line written by src/libslic3r/MeshRepairFix.cpp.
          grep -qa 'MeshRepair: repair' src/bambu-studio
          ldd src/bambu-studio | grep -i webkit || true
      - name: Name the AppImage
        id: out
        run: |
          version=$(sed -n 's/^[[:space:]]*set(SLIC3R_VERSION "\([^"]*\)")/\1/p' BambuStudio/version.inc)
          sha=$(git -C MeshRepair rev-parse --short=7 HEAD)
          name="BambuStudio-${version}-MeshRepair-${sha}-x86_64.AppImage"
          mv BambuStudio/build/BambuStudio_ubu64.AppImage "$name"
          sha256sum "$name" > "$name.sha256"
          webkit=$(ldd BambuStudio/build/src/bambu-studio | grep -o 'libwebkit2gtk-[0-9.]*' | head -n 1)
          {
            echo "name=$name"
            echo "version=$version"
            echo "sha=$sha"
            echo "webkit=$webkit"
          } >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: |
          ./${{ steps.out.outputs.name }} --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          ldd squashfs-root/bin/bambu-studio | grep 'not found' || true
          rm -rf squashfs-root
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: |
            ${{ steps.out.outputs.name }}
            ${{ steps.out.outputs.name }}.sha256
          retention-days: 14
      - name: Draft release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE: ${{ steps.out.outputs.name }}
          VERSION: ${{ steps.out.outputs.version }}
          SHA: ${{ steps.out.outputs.sha }}
          WEBKIT: ${{ steps.out.outputs.webkit }}
        run: |
          tag="bambustudio-${VERSION}-meshrepair-${SHA}"
          python3 - <<'EOF'
          import os, string, subprocess
          env = os.environ
          webkit = env["WEBKIT"] or "libwebkit2gtk-4.1"
          values = dict(
              appimage=env["APPIMAGE"],
              version=env["VERSION"],
              webkit=webkit,
              arch_webkit="webkit2gtk-4.1" if "4.1" in webkit else "webkit2gtk",
              repo_url=f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}",
              meshrepair_commit=env["GITHUB_SHA"],
              bambu_commit=subprocess.check_output(["git", "-C", "BambuStudio", "rev-parse", "HEAD"], text=True).strip(),
              run_url=f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}/actions/runs/{env['GITHUB_RUN_ID']}",
          )
          template = open("MeshRepair/integration/bambustudio/appimage-release-notes.md").read()
          open("notes.md", "w").write(string.Template(template).substitute(values))
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$APPIMAGE" "$APPIMAGE.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$APPIMAGE" "$APPIMAGE.sha256" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft \
              --title "Bambu Studio $VERSION with Fix model (unofficial Linux build)" \
              --notes-file notes.md
          fi
